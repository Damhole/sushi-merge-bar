<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Sushi Merge Bar — prototyp</title>
<style>
  :root {
    --cell: 80px;
    --gap: 8px;
    --salmon: #FF6B6B;
    --rice: #F5F0E8;
    --seaweed: #4A7C59;
    --gold: #FFD700;
    --ok: #34C759;
    --bad: #FF9500;
    --ink: #2b2b2b;
    --panel: #ffffff;
    --bg: #f3efe7;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    align-items: flex-start;     /* uchycení k vrchní hraně viewportu */
    justify-content: center;
    min-height: 100vh;
    padding: 16px;
    box-sizing: border-box;
    user-select: none;
  }

  /* Telefonový rámec – přirozená výška podle obsahu, max iPhone 17 Pro Max (932 px).
     Uchycený k vrchní hraně – zbylé místo dole zůstává prázdné jako pozadí. */
  .app {
    width: 100%;
    max-width: 360px;
    max-height: 932px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    width: 100%;
    max-width: 360px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    margin-bottom: 12px;
  }
  header .header-right { display: flex; align-items: center; gap: 10px; }

  /* Stepper: [− 4 +] – kompaktní přepínač levelů */
  .level-stepper {
    display: flex; align-items: center;
    background: #e3ddd0;
    border-radius: 22px;
    padding: 2px;
    gap: 0;
  }
  .level-stepper button {
    width: 26px; height: 26px;
    border: none; background: transparent;
    font-size: 18px; font-weight: 800; line-height: 1;
    color: #555; cursor: pointer;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
    transition: background-color .15s, opacity .15s;
  }
  .level-stepper button:hover:not(:disabled) { background: rgba(0,0,0,.08); }
  .level-stepper button:disabled { opacity: .3; cursor: not-allowed; }
  .level-stepper .level-num {
    min-width: 26px; padding: 0 4px;
    font-size: 14px; font-weight: 800; color: #2b2b2b;
    text-align: center; line-height: 1;
  }
  .btn-icon {
    width: 30px; height: 30px; border-radius: 50%;
    background: #e3ddd0; color: #555; border: none;
    cursor: pointer; font-size: 16px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
    transition: transform .4s, background-color .15s;
  }
  .btn-icon:hover { background: #d5cdb8; }
  .btn-icon:active { transform: rotate(-360deg); }

  .panel {
    background: var(--panel);
    border-radius: 16px;
    padding: 14px;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
    margin-bottom: 14px;
  }

  /* ---- Recipe / task panel ---- */
  .task-title { font-size: 13px; font-weight: 600; color: #888; margin-bottom: 8px; text-transform: uppercase; letter-spacing: .5px; }
  /* Objednávky jako papírové lístky pověšené na kuchyňské liště.
     Žádný kontejner za nimi — sedí přímo na pozadí stránky. */
  .orders-wrap {
    width: 100%; max-width: 360px;
    margin: 0 auto 18px;
    padding: 0 4px;
    position: relative;
  }
  .orders-wrap .task-title {
    margin-bottom: 18px; /* místo pro klipy nahoře */
    text-align: center;
    min-height: 1px;
  }
  .score-display {
    display: inline-block;
    font-size: 32px;
    font-weight: 800;
    color: #2b2b2b;
    letter-spacing: 1.5px;
    line-height: 1;
  }
  /* Tenká kuchyňská lišta nad lístečky */
  .recipes::before {
    content: ""; position: absolute;
    left: 0; right: 0; top: 22px;
    height: 3px; background: #bbb1a0;
    border-radius: 2px;
    box-shadow: 0 1px 0 rgba(255,255,255,.5), 0 2px 3px rgba(0,0,0,.08);
  }
  .recipes {
    position: relative;
    display: flex; flex-direction: row; gap: 12px;
    overflow: hidden; padding: 14px 0 6px;
  }
  .order-card {
    position: relative;
    flex: 0 0 auto; width: 74px;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 10px 6px 8px;
    border-radius: 6px;
    background: #fffaf0;
    border: 1px solid rgba(0,0,0,.07);
    box-shadow:
      0 4px 10px rgba(0,0,0,.12),
      0 1px 2px rgba(0,0,0,.08);
    transition: box-shadow .25s, border-color .25s;
    animation: cardIn .3s ease-out;
  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
  /* Klip „kolíček" na liště */
  .order-card::before {
    content: ""; position: absolute;
    top: -10px; left: 50%;
    transform: translateX(-50%);
    width: 12px; height: 14px;
    background: #4a4a4a;
    border-radius: 2px 2px 1px 1px;
    box-shadow:
      inset 0 -2px 0 rgba(0,0,0,.25),
      inset 0 2px 0 rgba(255,255,255,.12),
      0 1px 2px rgba(0,0,0,.25);
  }
  /* Drobná dírka v klipu (kde prochází lišta) */
  .order-card::after {
    content: ""; position: absolute;
    top: -5px; left: 50%;
    transform: translateX(-50%);
    width: 4px; height: 2px;
    background: #2a2a2a;
    border-radius: 1px;
    z-index: 1;
  }
  .order-card.active {
    border-color: var(--gold);
    background: #fffdf2;
    box-shadow:
      0 0 0 3px rgba(255,215,0,.25),
      0 5px 12px rgba(0,0,0,.14);
  }

  /* Timed card – vyšší, se smajlíkem a barem nahoře */
  .order-card.timed {
    width: 78px;
    padding: 0;
    /* overflow:visible — jinak by se uřízl klipper nahoře */
  }
  .order-card.timed .card-head {
    border-radius: 6px 6px 0 0;
    overflow: hidden;
  }
  .order-card.timed .card-head {
    display: flex; align-items: center; gap: 5px;
    padding: 6px 6px 4px;
    width: 100%; box-sizing: border-box;
  }
  .order-card.timed .smiley {
    width: 20px; height: 20px; border-radius: 50%;
    background: #4CAF50;
    position: relative; flex-shrink: 0;
    transition: background-color .3s;
  }
  /* Two eyes */
  .order-card.timed .smiley::before,
  .order-card.timed .smiley::after {
    content: ''; position: absolute;
    top: 6px;
    width: 3px; height: 3px; border-radius: 50%;
    background: #fff;
  }
  .order-card.timed .smiley::before { left: 5px; }
  .order-card.timed .smiley::after  { right: 5px; }
  /* Mouth */
  .order-card.timed .smiley .mouth {
    position: absolute; bottom: 4px; left: 50%;
    transform: translateX(-50%);
    width: 9px; height: 5px;
    border-bottom: 2px solid #fff;
    border-radius: 0 0 50% 50%;
  }
  .order-card.timed .smiley.neutral .mouth {
    height: 0; bottom: 7px; width: 8px;
    border-bottom-width: 2px; border-radius: 0;
  }
  .order-card.timed .smiley.sad .mouth {
    bottom: 4px;
    border-bottom: none;
    border-top: 2px solid #fff;
    border-radius: 50% 50% 0 0;
  }
  .order-card.timed .timebar {
    flex: 1; height: 6px; border-radius: 3px;
    background: rgba(0,0,0,.1); overflow: hidden;
  }
  .order-card.timed .timebar-fill {
    height: 100%; background: #4CAF50;
    border-radius: 3px;
    transition: background-color .3s;
  }
  .order-card.timed .card-body {
    display: flex; flex-direction: column;
    align-items: center; gap: 8px;
    padding: 4px 6px 10px;
  }

  /* (starý score badge nahrazen velkým středovým .score-display) */
  /* +N body letící text při mergi */
  .points-pop {
    position: absolute; pointer-events: none;
    font-weight: 900; font-size: 16px; color: var(--gold);
    text-shadow: 0 2px 4px rgba(0,0,0,.25);
    animation: pointsFloat 1.2s ease-out forwards;
    z-index: 5;
  }
  @keyframes pointsFloat {
    0%   { opacity: 0; transform: translateY(0) scale(.8); }
    20%  { opacity: 1; transform: translateY(-8px) scale(1.15); }
    100% { opacity: 0; transform: translateY(-32px) scale(1); }
  }
  .order-card.more {
    background: #efe9dd; border-style: dashed; border-color: #d8cfbe;
    justify-content: center; min-height: 56px;
  }
  .order-card.more .card-name { font-size: 16px; color: #888; }
  .order-card .card-name { font-size: 10px; font-weight: 700; color: #999; white-space: nowrap; }
  .order-card .card-ings { display: flex; gap: 3px; }
  .order-card .mini { width: 18px; height: 18px; font-size: 11px; border-radius: 6px; border-width: 2px; }

  /* (starý řádek level tlačítek nahrazen kompaktním .level-stepper v hlavičce) */

  .mini {
    width: 26px; height: 26px; border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; border: 2px solid rgba(0,0,0,.12);
  }

  /* ---- Grid ---- */
  /* Pevný čtvercový prostor pro mřížku – velikost dlaždic se počítá v JS
     tak, aby celá mřížka (libovolné cols×rows) fitla do čtverce.
     Mřížka je zarovnaná ke spodnímu okraji = blíž k pultu, který je hned pod. */
  .grid-area {
    width: 100%; max-width: 360px;
    aspect-ratio: 1;
    margin: 0 auto 14px;
    display: flex;
    justify-content: center;
    align-items: flex-end;
  }
  .grid {
    display: grid; gap: var(--gap);
    /* grid-template-columns + grid-auto-rows jsou inline z JS podle počtu sloupců/řad */
  }
  .cell {
    border-radius: 14px;
    background: #ece6da;
    display: flex; align-items: center; justify-content: center;
    transition: transform .12s, box-shadow .12s;
  }
  .ingredient {
    position: relative;
    width: 100%; height: 100%;
    border-radius: 14px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-size: clamp(18px, 6.5vw, 30px); cursor: pointer;
    border: 3px solid rgba(0,0,0,.12);
    box-shadow: 0 2px 5px rgba(0,0,0,.12);
    transition: transform .1s, filter .15s;
  }
  .ingredient:active { transform: scale(.92); }
  .ingredient.locked {
    filter: grayscale(1) brightness(.72);
    opacity: .7; cursor: not-allowed;
    box-shadow: inset 0 0 0 100px rgba(0,0,0,.12);
  }
  .ingredient.locked:active { transform: none; }
  .ingredient.mystery {
    background: repeating-linear-gradient(45deg, #c8c0ae 0 6px, #b9b09b 6px 12px);
    color: #fff;
    cursor: not-allowed;
    border-color: rgba(0,0,0,.18);
  }
  .ingredient.mystery .qmark {
    font-size: clamp(26px, 9vw, 38px);
    font-weight: 900;
    color: #fff;
    text-shadow: 0 2px 4px rgba(0,0,0,.25);
  }
  .ingredient.reveal { animation: revealPop .4s ease-out; }
  @keyframes revealPop {
    0% { transform: scale(.85) rotate(-4deg); }
    50% { transform: scale(1.1) rotate(2deg); }
    100% { transform: scale(1) rotate(0); }
  }
  .ingredient .lbl { display: none; }

  .t-salmon  { background: var(--salmon); }
  .t-rice    { background: var(--rice); border-color: #ccc; }
  .t-seaweed { background: var(--seaweed); color: #fff; }
  .t-seaweed .lbl { color: #fff; opacity: .8; }
  .t-tuna    { background: #C0392B; color: #fff; }
  .t-tuna .lbl { color: #fff; opacity: .85; }
  .t-avocado { background: #9CCC65; }
  .t-ginger  { background: #F4B860; }
  .t-cucumber { background: #26A69A; color: #fff; }
  .t-cucumber .lbl { color: #fff; opacity: .85; }
  .t-crab    { background: #FF8C42; }

  /* ---- Stash ---- */
  .stash-wrap { display: flex; flex-direction: column; align-items: center; }
  .stash-label { font-size: 12px; color: #888; margin-bottom: 6px; align-self: flex-start; }
  .stash {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    width: 100%;
  }
  .slot {
    aspect-ratio: 1;
    border-radius: 12px;
    background: #efe9dd;
    border: 2px dashed #d8cfbe;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }
  .slot .ingredient { border-width: 2px; font-size: 22px; box-shadow: none; }
  .slot .ingredient .lbl { display: none; }
  .stash.flash-bad { animation: shake .4s; }
  .stash.flash-bad .slot { border-color: var(--bad); }
  @keyframes shake {
    0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)}
    40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)}
  }
  .merge-pop { animation: pop .35s; }
  @keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.25)} 100%{transform:scale(0)} }

  /* ---- Buttons ---- */
  .buttons { display: flex; gap: 10px; margin-top: 16px; width: 100%; max-width: 360px; }
  button {
    flex: 1; padding: 13px; border: none; border-radius: 12px;
    font-size: 15px; font-weight: 700; cursor: pointer; transition: .15s;
  }
  button:active { transform: scale(.97); }
  .btn-submit { background: var(--ink); color: #fff; }
  .btn-reset  { background: #e3ddd0; color: #555; }

  /* ---- Overlays ---- */
  .overlay {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center; flex-direction: column;
    color: #fff; text-align: center; padding: 24px; z-index: 10;
  }
  .overlay.show { display: flex; animation: fade .3s; }
  @keyframes fade { from{opacity:0} to{opacity:1} }
  .overlay h2 { font-size: 34px; margin: 0 0 8px; }
  .overlay p { font-size: 16px; margin: 0 0 24px; opacity: .95; }
  .overlay button { flex: 0 0 auto; width: 240px; max-width: 80%; background: rgba(255,255,255,.95); color: var(--ink); }
  #overlay-win { background: rgba(52,199,89,.96); }
  #overlay-over { background: rgba(255,149,0,.96); }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--bad); color: #fff; padding: 10px 18px; border-radius: 20px;
    font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: .25s; z-index: 20;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
  <div class="app">
  <header>
    <div class="header-right">
      <div class="level-stepper" id="level-stepper">
        <button id="btn-level-prev" aria-label="Předchozí level">−</button>
        <span class="level-num" id="level-num">1</span>
        <button id="btn-level-next" aria-label="Další level">+</button>
      </div>
      <button class="btn-icon" id="btn-reset" title="Reset levelu" aria-label="Reset levelu">↻</button>
    </div>
  </header>

  <!-- Objednávkové lístečky – „na liště" v kuchyni, bez kontejneru -->
  <div class="orders-wrap">
    <div class="task-title" id="task-title"></div>
    <div class="recipes" id="recipes"></div>
  </div>

  <!-- Grid – fixní čtvercová oblast, dlaždice se škálují uvnitř -->
  <div class="grid-area" id="grid-area">
    <div class="grid" id="grid"></div>
  </div>

  <!-- Stash -->
  <div class="panel stash-wrap" style="margin-top:14px;">
    <div class="stash-label" id="stash-label">Pult (zásobník)</div>
    <div class="stash" id="stash"></div>
  </div>
  </div><!-- /.app -->


  <!-- Overlays -->
  <div class="overlay" id="overlay-win">
    <h2>Level splněn! 🎉</h2>
    <p id="win-msg"></p>
    <button id="btn-next">Další level</button>
  </div>
  <div class="overlay" id="overlay-over">
    <h2>Game Over</h2>
    <p>Pult je plný a nejde sestavit žádný recept.</p>
    <button id="btn-restart">Reset</button>
  </div>

  <div class="toast" id="toast"></div>

<script>
/* =========================================================================
   Sushi Merge Bar — MVP prototyp
   - click-to-send ovládání
   - zásobník 7 slotů, auto-merge libovolných 3 surovin dle aktivního receptu
   - barvy ze specifikace
   ========================================================================= */

const STASH_SIZE = 7;
const VISIBLE_ORDERS = 4; // hráč vidí jen 4 objednávky a může plnit jen je

// Timer / scoring (jen pro „timed" levely)
const ORDER_DURATION = 30000; // 30 sekund od vstupu do viditelné fronty
const PHASE_GREEN_END = 0.40; // 0–12s: zelená, 100 bodů
const PHASE_YELLOW_END = 0.75; // 12–22.5s: oranžová, 60 bodů; po 22.5s: červená, 20 bodů

const TYPES = {
  salmon:   { label: "L", icon: "🐟", cls: "t-salmon"   },
  rice:     { label: "R", icon: "🍚", cls: "t-rice"     },
  seaweed:  { label: "Ř", icon: "🌿", cls: "t-seaweed"  },
  tuna:     { label: "T", icon: "🐠", cls: "t-tuna"     },
  avocado:  { label: "A", icon: "🥑", cls: "t-avocado"  },
  ginger:   { label: "Z", icon: "🫚", cls: "t-ginger"   },
  cucumber: { label: "C", icon: "🥒", cls: "t-cucumber" },
  crab:     { label: "K", icon: "🦀", cls: "t-crab"     },
};

// Pomocníci pro definici levelů
const MAKI    = { name: "Maki",    items: ["salmon", "rice", "seaweed"] };
const NIGIRI  = { name: "Nigiri",  items: ["tuna",   "avocado", "ginger"] };
// Uramaki sdílí rýži s Maki – proto rýže je v L5 nejčastější surovina.
const URAMAKI = { name: "Uramaki", items: ["rice",   "cucumber", "crab"] };

function makiOrders(n) {
  return Array.from({ length: n }, () => ({ name: MAKI.name, items: MAKI.items.slice() }));
}
// Promíchá zadané počty pokrmů pomocí seedovaného PRNG (Mulberry32).
// specs = [{recipe, count}, ...]. Stejný seed = stejné pořadí pokaždé.
function shuffledOrders(specs, seed) {
  const arr = [];
  specs.forEach(({ recipe, count }) => {
    for (let i = 0; i < count; i++) arr.push({ name: recipe.name, items: recipe.items.slice() });
  });
  let s = seed >>> 0;
  const rnd = () => {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
// Zachováno pro L4 (zpětná kompatibilita).
function shuffledMixed(m, n, seed) {
  return shuffledOrders([{ recipe: MAKI, count: m }, { recipe: NIGIRI, count: n }], seed);
}
const CHAR_TO_TYPE = {
  L: "salmon",   R: "rice",     "Ř": "seaweed",
  T: "tuna",     A: "avocado",  Z: "ginger",
  C: "cucumber", K: "crab",
};

// Level definice (chovají se jako "JSON levelu")
const LEVELS = [
  {
    name: "Level 1 — Maki Sushi",
    cols: 4, rows: 4,
    ingredients: [
      { type: "salmon",  col: 0, row: 1 },
      { type: "rice",    col: 1, row: 1 },
      { type: "seaweed", col: 2, row: 1 },
    ],
    recipes: [
      { name: "Maki", items: ["salmon", "rice", "seaweed"] },
    ],
  },
  {
    name: "Level 2 — 2× Maki Sushi",
    cols: 4, rows: 4,
    ingredients: [
      { type: "salmon",  col: 0, row: 0 }, { type: "rice", col: 2, row: 0 }, { type: "seaweed", col: 3, row: 1 },
      { type: "seaweed", col: 0, row: 3 }, { type: "rice", col: 1, row: 2 }, { type: "salmon",  col: 3, row: 3 },
    ],
    recipes: [
      { name: "Maki", items: ["salmon", "rice", "seaweed"] },
      { name: "Maki", items: ["salmon", "rice", "seaweed"] },
    ],
  },
  {
    // Plná mřížka 6×4 = 24 surovin = 8 objednávek.
    // Aktivní je jen vnější linie (má volnou stranu), vnitřek je zamčený.
    name: "Level 3 — Sushi Rush",
    map: [
      "ŘŘŘŘŘŘ",
      "ŘŘLLLL",
      "RRRRLL",
      "RRRRLL",
    ],
    recipes: makiOrders(8),
  },
  {
    // 6×5 = 30 surovin. Dva pokrmy (Maki + Nigiri) prolínané v clusterech.
    // Hráč musí žonglovat mezi 6 typy surovin a 10 objednávkami.
    name: "Level 4 — Combo Bar",
    // Malá písmena = mystery box (?), odhalí se až bude políčko přístupné.
    map: [
      "ŘŘŘZZZ",
      "Řřtzzt",
      "AATtLL",
      "AAtRlL",
      "ARRRLR",
    ],
    recipes: shuffledMixed(5, 5, 7),
  },
  {
    // 6×6 = 36 surovin, 3 pokrmy, 12 objednávek.
    // Maki & Uramaki sdílí rýži → rýže je v gridu nejčastější (8 ks).
    name: "Level 5 — Triple Threat",
    map: [
      "ŘŘŘZZZ",
      "ŘcttZC",
      "KAakLL",
      "KAktTL",
      "RALRCC",
      "RRRRRR",
    ],
    recipes: shuffledOrders([
      { recipe: MAKI,    count: 4 },
      { recipe: NIGIRI,  count: 4 },
      { recipe: URAMAKI, count: 4 },
    ], 13),
  },
  {
    // Timed level – každá viditelná objednávka má 30s. Zelená 100b, žlutá 60b, červená 20b.
    // Mřížka 6×5 = 30 surovin, 9 objednávek (3 každého pokrmu), žádné mystery, ať se hráč soustředí na čas.
    name: "Level 6 — Rush Hour",
    timed: true,
    // 30 surovin = přesně 10 objednávek (3 Maki + 4 Nigiri + 3 Uramaki).
    // Spodní řada má T/A/Z (na okamžitý start Nigiri) + 3 rýže (pro Maki/Uramaki).
    map: [
      "ŘZŘZŘZ",
      "TATATA",
      "KCKCKC",
      "LRLRLR",
      "TAZRRR",
    ],
    recipes: shuffledOrders([
      { recipe: MAKI,    count: 3 },
      { recipe: NIGIRI,  count: 4 },
      { recipe: URAMAKI, count: 3 },
    ], 21),
  },
];

// ---- Stav ----
let levelIndex = 0;
let grid;        // Map "col,row" -> {type, col, row}
let stash;       // pole instancí {type, origin:{col,row}}
let recipes;     // pole {name, items, done, spawnedAt?}
let cols, rows;
let ordersSig = null; // podpis fronty objednávek – karty se překreslí jen při změně
let score = 0;
let rafId = null;

function isTimedLevel() {
  return !!(LEVELS[levelIndex] && LEVELS[levelIndex].timed);
}

// Vrátí fázi podle uplynulého času od spawnu objednávky.
function phaseFromElapsed(elapsed) {
  const r = Math.min(1, Math.max(0, elapsed / ORDER_DURATION));
  if (r < PHASE_GREEN_END)       return { phase: "green",  pts: 100, color: "#43A047", smileyCls: "",        fillPct: (1 - r) * 100 };
  if (r < PHASE_YELLOW_END)      return { phase: "yellow", pts: 60,  color: "#FB8C00", smileyCls: "neutral", fillPct: (1 - r) * 100 };
  return                                { phase: "red",    pts: 20,  color: "#E53935", smileyCls: "sad",     fillPct: (1 - r) * 100 };
}

function getOrderPoints(idx) {
  if (!isTimedLevel()) return 100;
  const r = recipes[idx];
  if (!r || !r.spawnedAt) return 100;
  return phaseFromElapsed(Date.now() - r.spawnedAt).pts;
}

function startTimerLoop() {
  if (rafId) cancelAnimationFrame(rafId);
  const tick = () => {
    if (isTimedLevel()) tickOrders();
    rafId = requestAnimationFrame(tick);
  };
  rafId = requestAnimationFrame(tick);
}

function tickOrders() {
  if (!recipes) return;
  const now = Date.now();
  document.querySelectorAll('.order-card.timed[data-recipe-idx]').forEach(card => {
    const idx = +card.dataset.recipeIdx;
    const r = recipes[idx];
    if (!r || r.done) return;
    if (!r.spawnedAt) r.spawnedAt = now;
    const p = phaseFromElapsed(now - r.spawnedAt);
    const fill = card.querySelector('.timebar-fill');
    const smiley = card.querySelector('.smiley');
    if (fill) {
      fill.style.width = p.fillPct + "%";
      fill.style.background = p.color;
    }
    if (smiley) {
      smiley.className = "smiley" + (p.smileyCls ? " " + p.smileyCls : "");
      smiley.style.background = p.color;
    }
  });
}

function flyPoints(idx, pts) {
  const card = document.querySelector(`.order-card[data-recipe-idx="${idx}"]`);
  const wrap = document.getElementById("recipes");
  if (!card || !wrap) return;
  const r = card.getBoundingClientRect();
  const wr = wrap.getBoundingClientRect();
  const pop = document.createElement("div");
  pop.className = "points-pop";
  pop.textContent = `+${pts}`;
  pop.style.left = (r.left - wr.left + r.width / 2 - 12) + "px";
  pop.style.top = (r.top - wr.top + 8) + "px";
  wrap.style.position = "relative";
  wrap.appendChild(pop);
  setTimeout(() => pop.remove(), 1200);
}

const $ = (id) => document.getElementById(id);

function loadLevel(idx) {
  const lvl = LEVELS[idx];
  ordersSig = null; // vynuť překreslení objednávek při načtení levelu
  score = 0;
  grid = new Map();
  if (lvl.map) {
    rows = lvl.map.length;
    cols = [...lvl.map[0]].length;
    lvl.map.forEach((line, r) => {
      [...line].forEach((ch, c) => {
        if (ch === '.' || ch === ' ') return;
        // Malé písmeno = skrytá surovina (mystery box). Velké = viditelná.
        const upper = ch.toUpperCase();
        const type = CHAR_TO_TYPE[upper];
        if (!type) return;
        const hidden = ch !== upper;
        grid.set(key(c, r), { type, col: c, row: r, hidden });
      });
    });
  } else {
    cols = lvl.cols; rows = lvl.rows;
    lvl.ingredients.forEach(ing => {
      grid.set(key(ing.col, ing.row), { type: ing.type, col: ing.col, row: ing.row });
    });
  }
  stash = [];
  recipes = lvl.recipes.map(r => ({ name: r.name, items: r.items.slice(), done: false }));
  renderLevelStepper();
  hideOverlays();
  render();
}

const key = (c, r) => `${c},${r}`;

function activeRecipeIndex() {
  return recipes.findIndex(r => !r.done);
}

// Indexy aktuálně viditelných (= splnitelných) objednávek – prvních N čekajících.
function visibleRecipeIndices() {
  const out = [];
  for (let i = 0; i < recipes.length && out.length < VISIBLE_ORDERS; i++) {
    if (!recipes[i].done) out.push(i);
  }
  return out;
}

// Surovina je sebratelná, má-li vedle sebe aspoň jedno volné pole:
// prázdné sousední pole v mřížce (nahoře / dole / vlevo / vpravo),
// NEBO je ve spodní řadě (spodní okraj = výdej).
// Levý, pravý a horní okraj jsou stěny → samotný okraj přístup nedává.
function isActive(c, r) {
  if (r === rows - 1) return true; // spodní okraj = výdej
  const dirs = [[0, -1], [0, 1], [-1, 0], [1, 0]];
  return dirs.some(([dc, dr]) => {
    const nc = c + dc, nr = r + dr;
    if (nc < 0 || nr < 0 || nc >= cols || nr >= rows) return false; // okraj = stěna
    return !grid.has(key(nc, nr));
  });
}

// ---- Akce hráče ----
function sendToStash(c, r) {
  const cell = grid.get(key(c, r));
  if (!cell) return;
  if (!isActive(c, r)) { toast("Zablokováno – odeber nejdřív sousední suroviny"); return; }
  if (stash.length >= STASH_SIZE) { toast("Pult je plný"); return; }
  grid.delete(key(c, r));
  stash.push({ type: cell.type, origin: { col: c, row: r } });
  render();
  // auto-merge + následné kontroly
  setTimeout(() => { tryMerge(); }, 120);
}

// Surovinu z pultu už nelze vrátit zpět do mřížky.
// Co položíš na pult, tam zůstane dokud nezmizí mergem.

// Najde v zásobníku indexy 3 surovin tvořících multiset receptu
function findMatch(recipe) {
  const need = {};
  recipe.items.forEach(t => need[t] = (need[t] || 0) + 1);
  const picked = [];
  const remaining = { ...need };
  for (let i = 0; i < stash.length; i++) {
    const t = stash[i].type;
    if (remaining[t] > 0) {
      remaining[t]--;
      picked.push(i);
    }
  }
  const allFound = Object.values(remaining).every(v => v === 0);
  return allFound ? picked : null;
}

function tryMerge() {
  let merged = false;
  let guard = 0;
  while (guard++ < 20) {
    // Hráč může splnit jen aktuálně viditelné objednávky (prvních VISIBLE_ORDERS).
    // Pořadí preferuje dřívější, ale lze splnit kteroukoli viditelnou.
    let hitIdx = -1, hitMatch = null;
    for (const i of visibleRecipeIndices()) {
      const m = findMatch(recipes[i]);
      if (m) { hitIdx = i; hitMatch = m; break; }
    }
    if (hitIdx === -1) break;
    animateMerge(hitMatch);
    hitMatch.sort((a, b) => b - a).forEach(i => stash.splice(i, 1));
    const pts = getOrderPoints(hitIdx);
    score += pts;
    if (isTimedLevel()) flyPoints(hitIdx, pts);
    recipes[hitIdx].done = true;
    merged = true;
  }
  if (merged) {
    render();
    flashStash("ok");
    if (checkWin()) return;
  }
  checkGameOver();
}

// ---- Tlačítka ----
function onSubmit() {
  const anyMatch = visibleRecipeIndices().some(i => findMatch(recipes[i]));
  if (anyMatch) {
    tryMerge();
  } else {
    flashStash("bad");
    toast("Žádná z viditelných objednávek nesedí");
  }
}

function checkWin() {
  const queueEmpty = recipes.every(r => r.done);
  const gridEmpty = grid.size === 0;
  if (queueEmpty && gridEmpty) {
    setTimeout(() => {
      const maxScore = recipes.length * 100;
      const scoreLine = isTimedLevel()
        ? `Skóre: ${score} / ${maxScore}` : "";
      const baseMsg = (levelIndex < LEVELS.length - 1)
        ? "Všechny objednávky hotové."
        : "Dokončil jsi všechny levely. 🍱";
      $("win-msg").innerHTML = baseMsg + (scoreLine ? `<br><strong style="color:#FFD700">${scoreLine}</strong>` : "");
      $("btn-next").textContent = (levelIndex < LEVELS.length - 1) ? "Další level" : "Hrát znovu";
      $("overlay-win").classList.add("show");
    }, 300);
    return true;
  }
  return false;
}

function checkGameOver() {
  const gridHasIngredients = grid.size > 0;
  const stashFull = stash.length >= STASH_SIZE;
  const anyMatch = visibleRecipeIndices().some(i => findMatch(recipes[i]));
  // Vracení už není možné. Game over = pult plný + žádná viditelná objednávka
  // nelze splnit + v mřížce ještě jsou suroviny.
  if (stashFull && gridHasIngredients && !anyMatch) {
    $("overlay-over").classList.add("show");
  }
}

// ---- Render ----
function render() {
  renderRecipes();
  renderGrid();
  renderStash();
}

function renderRecipes() {
  const done = recipes.filter(r => r.done).length;
  // Karty se překreslí (a přijedou zprava) jen když se fronta opravdu změní:
  // jiné indexy viditelných objednávek nebo jiný počet hotovo/celkem.
  const sig = `${done}/${recipes.length}|${visibleRecipeIndices().join(",")}|${isTimedLevel()?1:0}`;
  if (sig === ordersSig) {
    // Skóre přepisuj i tak (mění se mezi překresleními).
    updateScoreDisplay();
    return;
  }
  ordersSig = sig;

  const wrap = $("recipes");
  wrap.innerHTML = "";
  // U timed levelu zobraz velké skóre uprostřed, jinak nic – hráč nemá vědět co ho čeká.
  $("task-title").innerHTML = isTimedLevel()
    ? `<span class="score-display" id="score-display">${score}</span>`
    : "";

  const pendingPairs = recipes
    .map((r, i) => ({ r, i }))
    .filter(x => !x.r.done);

  if (pendingPairs.length === 0) {
    wrap.innerHTML = `<span style="color:#888;font-size:13px;padding:6px;">Všechny objednávky hotové 🎉</span>`;
    return;
  }

  const now = Date.now();
  pendingPairs.slice(0, VISIBLE_ORDERS).forEach(({ r, i: idx }, pos) => {
    const ings = r.items.map(t =>
      `<div class="mini ${TYPES[t].cls}">${TYPES[t].icon}</div>`).join("");
    const card = document.createElement("div");
    card.className = "order-card" + (pos === 0 ? " active" : "") + (isTimedLevel() ? " timed" : "");
    card.dataset.recipeIdx = idx;

    if (isTimedLevel()) {
      if (!r.spawnedAt) r.spawnedAt = now;
      const p = phaseFromElapsed(now - r.spawnedAt);
      card.innerHTML = `
        <div class="card-head">
          <div class="smiley${p.smileyCls ? " " + p.smileyCls : ""}" style="background:${p.color};">
            <span class="mouth"></span>
          </div>
          <div class="timebar">
            <div class="timebar-fill" style="width:${p.fillPct}%; background:${p.color};"></div>
          </div>
        </div>
        <div class="card-body">
          <span class="card-name">${r.name}</span>
          <span class="card-ings">${ings}</span>
        </div>`;
    } else {
      card.innerHTML = `<span class="card-name">${r.name}</span><span class="card-ings">${ings}</span>`;
    }
    wrap.appendChild(card);
  });
}

function updateScoreDisplay() {
  const el = document.getElementById("score-display");
  if (!el) return;
  el.textContent = String(score);
}

function renderLevelStepper() {
  $("level-num").textContent = String(levelIndex + 1);
  $("btn-level-prev").disabled = levelIndex === 0;
  $("btn-level-next").disabled = levelIndex === LEVELS.length - 1;
}

function renderGrid() {
  const g = $("grid");
  // Vypočti velikost dlaždice tak, aby čtvercové cely fitly do pevné oblasti.
  const area = g.parentElement;
  const areaW = area.clientWidth  || 360;
  const areaH = area.clientHeight || 360;
  const gap = 8;
  const cellSize = Math.floor(Math.min(
    (areaW - gap * (cols - 1)) / cols,
    (areaH - gap * (rows - 1)) / rows
  ));
  g.style.gridTemplateColumns = `repeat(${cols}, ${cellSize}px)`;
  g.style.gridAutoRows = `${cellSize}px`;
  g.style.gap = `${gap}px`;
  g.innerHTML = "";
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      const ing = grid.get(key(c, r));
      if (ing) {
        const active = isActive(c, r);
        // Mystery box: jakmile se odemkne, surovina se odhalí (a zůstane odhalená).
        const justRevealed = active && ing.hidden;
        if (justRevealed) ing.hidden = false;
        const onClick = active
          ? () => sendToStash(c, r)
          : () => toast(ing.hidden ? "Záhada – odhalí se až bude přístupná"
                                   : "Zablokováno – odeber nejdřív sousední suroviny");
        cell.appendChild(makeIngredient(ing.type, onClick, active, ing.hidden, justRevealed));
      }
      g.appendChild(cell);
    }
  }
}

function renderStash() {
  const s = $("stash");
  s.innerHTML = "";
  $("stash-label").textContent = `Pult (zásobník) — ${stash.length}/${STASH_SIZE}`;
  for (let i = 0; i < STASH_SIZE; i++) {
    const slot = document.createElement("div");
    slot.className = "slot";
    if (stash[i]) {
      // Surovinu v pultu nelze vrátit – klik nedělá nic.
      const el = makeIngredient(stash[i].type, () => {});
      el.style.cursor = "default";
      slot.appendChild(el);
    }
    s.appendChild(slot);
  }
}

function makeIngredient(type, onClick, active = true, hidden = false, justRevealed = false) {
  const el = document.createElement("div");
  if (hidden) {
    el.className = "ingredient mystery";
    el.innerHTML = `<span class="qmark">?</span>`;
  } else {
    const t = TYPES[type];
    el.className = `ingredient ${t.cls}` + (active ? "" : " locked") + (justRevealed ? " reveal" : "");
    el.innerHTML = `${t.icon}<span class="lbl">${t.label}</span>`;
  }
  el.addEventListener("click", onClick);
  return el;
}

// ---- Feedback ----
function flashStash(kind) {
  const s = $("stash");
  if (kind === "bad") {
    s.classList.add("flash-bad");
    setTimeout(() => s.classList.remove("flash-bad"), 400);
  }
}
function animateMerge(indices) {
  const slots = $("stash").children;
  indices.forEach(i => {
    const ing = slots[i] && slots[i].querySelector(".ingredient");
    if (ing) ing.classList.add("merge-pop");
  });
}
let toastTimer;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
}
function hideOverlays() {
  $("overlay-win").classList.remove("show");
  $("overlay-over").classList.remove("show");
}

// ---- Init ----
$("btn-reset").addEventListener("click", () => loadLevel(levelIndex));
$("btn-level-prev").addEventListener("click", () => {
  if (levelIndex > 0) { levelIndex--; loadLevel(levelIndex); }
});
$("btn-level-next").addEventListener("click", () => {
  if (levelIndex < LEVELS.length - 1) { levelIndex++; loadLevel(levelIndex); }
});
$("btn-restart").addEventListener("click", () => loadLevel(levelIndex));
$("btn-next").addEventListener("click", () => {
  levelIndex = (levelIndex + 1) % LEVELS.length;
  loadLevel(levelIndex);
});

loadLevel(0);
startTimerLoop();

// Při resize/otočení překresli grid – dlaždice se přepočítají na novou šířku oblasti.
let resizeRaf = null;
window.addEventListener("resize", () => {
  if (resizeRaf) cancelAnimationFrame(resizeRaf);
  resizeRaf = requestAnimationFrame(() => renderGrid());
});
</script>
</body>
